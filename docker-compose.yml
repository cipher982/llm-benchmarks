services:
  llm-bench-api-service:
    build:
      context: .
      dockerfile: cloud/Dockerfile-scheduler
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB:-llm-bench}
      - MONGODB_COLLECTION_CLOUD=${MONGODB_COLLECTION_CLOUD:-metrics_cloud_v2}
      - MONGODB_COLLECTION_ERRORS=${MONGODB_COLLECTION_ERRORS:-errors_cloud}
      - MONGODB_COLLECTION_MODELS=${MONGODB_COLLECTION_MODELS:-models}
      - MONGODB_COLLECTION_BENCH_JOBS=${MONGODB_COLLECTION_BENCH_JOBS:-bench_jobs}
      - BENCHMARK_PROVIDERS=${BENCHMARK_PROVIDERS:-all}
      - FRESH_MINUTES=${FRESH_MINUTES:-30}
      - BENCHMARK_LIVENESS_MAX_IDLE_SECONDS=${BENCHMARK_LIVENESS_MAX_IDLE_SECONDS:-900}
      - BENCHMARK_LIVENESS_STARTUP_GRACE_SECONDS=${BENCHMARK_LIVENESS_STARTUP_GRACE_SECONDS:-600}
      # Must name only providers this host actually runs a worker for: a lane in
      # this list with no worker has no heartbeat, which liveness now reads as a
      # dead thread and restarts the container for. The retired providers were
      # still listed here after consolidation.
      - BENCHMARK_LIVENESS_PROVIDERS=${BENCHMARK_LIVENESS_PROVIDERS:-openai,vertex,openrouter}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/drose/bench-sa-key.json:/app/gcp-key.json:ro
    # Emit logs to stdout/stderr (captured by Docker), no volume mount
    command: python -m llm_bench.scheduler.cli daemon
    healthcheck:
      test: ["CMD", "python", "-m", "llm_bench.scheduler.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
